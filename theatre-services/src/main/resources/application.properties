server.port=8084
spring.application.name=theatre-service

spring.datasource.url=${THEATRE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${THEATRE_DB_USERNAME:THEATRE_APP}
spring.datasource.password=${THEATRE_DB_PASSWORD:TheatreApp@123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.com.example.theatreservice=INFO
logging.level.org.hibernate.SQL=DEBUG
