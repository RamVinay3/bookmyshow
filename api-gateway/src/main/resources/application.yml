server:
  port: 9000
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
           routes:

             - id: movie-service
               uri: lb://movie-service
               predicates:
                 - Path=/api/movies/**
             - id: booking-service
               uri: lb://booking-service
               predicates:
                 - Path=/api/booking/**
             - id: user-service
               uri: lb://user-service
               predicates:
                   - Path=/api/users/**
             - id: wallet-service
               uri: lb://wallet-service
               predicates:
                 - Path=/api/wallet/**
             - id: theatre-service
               uri: lb://theatre-service
               predicates:
                 - Path=/api/theatre/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/