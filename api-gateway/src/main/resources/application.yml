server:
  port: 9000
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
           routes:

             - id: movie-service
               uri: lb://movie-service
               predicates:
                 - Path=/api/movies/**
             - id: booking-service
               uri: lb://booking-service
               predicates:
                 - Path=/api/booking/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:7070/eureka/