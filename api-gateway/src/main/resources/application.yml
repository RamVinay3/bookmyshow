server:
  port: 9000
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
           routes:
             - id: show-service
               uri: lb://show-service
               predicates:
                 - Path=/api/shows/**
               filters:
                 - name: RequestRateLimiter
                   args:
                     key-resolver: "#{@ipKeyResolver}"
                     redis-rate-limiter.replenishRate: 1
                     redis-rate-limiter.burstCapacity: 20
                     redis-rate-limiter.requestedTokens: 2
             - id: movie-service
               uri: lb://movie-service
               predicates:
                 - Path=/api/movies/**
               filters:
               - name: RequestRateLimiter
                 args:
                   key-resolver: "#{@ipKeyResolver}"
                   redis-rate-limiter.replenishRate: 10
                   redis-rate-limiter.burstCapacity: 20
                   redis-rate-limiter.requestedTokens: 1

             - id: booking-service
               uri: lb://booking-service
               predicates:
                 - Path=/api/booking/**
             - id: user-service
               uri: lb://user-service
               predicates:
                   - Path=/api/users/**

             - id: wallet-service
               uri: lb://wallet-service
               predicates:
                 - Path=/api/wallet/**
             - id: theatre-service
               uri: lb://theatre-service
               predicates:
                 - Path=/api/theatre/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/