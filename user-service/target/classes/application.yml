server:
  port: 8087

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${USER_DB_USERNAME:USER_APP}
    password: ${USER_DB_PASSWORD:UserApp@123}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.userservice: INFO
    org.hibernate.SQL: DEBUG
