server.port=8085
spring.application.name=show-service
spring.datasource.url=${SHOW_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SHOW_DB_USERNAME:SHOW_APP}
spring.datasource.password=${SHOW_DB_PASSWORD:ShowApp@123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
services.movie.base-url=${MOVIE_SERVICE_URL:http://movie-service}
services.theatre.base-url=${THEATRE_SERVICE_URL:http://theatre-service}
management.endpoints.web.exposure.include=health,info
logging.level.com.example.showservice=INFO
logging.level.org.hibernate.SQL=DEBUG
