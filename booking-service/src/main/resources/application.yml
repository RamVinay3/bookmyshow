spring:

  application:
    name: booking-service
  datasource:

    url: jdbc:oracle:thin:@localhost:1521/FREE
    username: backend_platform
    password: backend_password

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 9091

services:
  movie:
    base-url: ${MOVIE_SERVICE_URL:http://movie-service}
  show:
    base-url: ${SHOW_SERVICE_URL:http://show-service}
  theatre:
    base-url: ${THEATRE_SERVICE_URL:http://theatre-service}
  wallet:
    base-url: ${WALLET_SERVICE_URL:http://wallet-service}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
resilience4j:
  retry:
    retryAspectOrder: 401 # represents inner layer as the number is greater ,so error comes,it will reach the retry box, then it sees the order either retries or ignore
    instances:
      movieService:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:

          - com.example.booking_service.exception.MovieServiceTimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignoreExceptions:
          - com.example.booking_service.exception.MovieNotFoundException

  circuitbreaker:
    circuitBreakerAspectOrder: 400 # represents outer layer as the number is less
    instances:
      movieService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - com.example.booking_service.exception.MovieNotFoundException
