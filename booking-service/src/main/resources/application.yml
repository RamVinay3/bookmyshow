spring:

  application:
    name: booking-service
  datasource:

    url: jdbc:oracle:thin:@localhost:1521/FREE
    username: backend_platform
    password: backend_password

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 9091

services:
  movie:
    base-url: ${MOVIE_SERVICE_URL:http://localhost:9000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
resilience4j:
  circuitbreaker:
    instances:
      movieService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        maxAttempts: 3
        waitDuration: 500ms
#        retryExceptions:
#          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.example.booking_service.exception.MovieNotFoundException
          - com.example.booking_service.exception.MovieServiceTimeoutException
          - com.example.booking_service.exception.MovieServiceUnReachableException